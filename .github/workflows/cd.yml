name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm deployment targets the current main commit
        id: freshness
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$CI_SHA" ]; then
            echo "main has advanced since this CI run; skipping this deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deployment
        if: steps.freshness.outputs.deploy == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "GitHub Actions secret RENDER_DEPLOY_HOOK_URL is not configured." >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            --output /dev/null \
            "$RENDER_DEPLOY_HOOK_URL"