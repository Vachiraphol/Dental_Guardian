name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dental_guardian
          POSTGRES_USER: ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dental_guardian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      DATABASE_URL: postgresql+psycopg2://ci:ci@127.0.0.1:5432/dental_guardian

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Prepare database schema for Reflex compilation
        run: |
          python -c "import os; from sqlmodel import SQLModel, create_engine; import dental_clinic_system.backend.models; SQLModel.metadata.create_all(create_engine(os.environ['DATABASE_URL']))"

      - name: Check Python syntax
        run: python -m compileall -q dental_clinic_system alembic rxconfig.py

      - name: Initialize Reflex app
        run: reflex init

      - name: Build production frontend
        run: reflex export --no-zip